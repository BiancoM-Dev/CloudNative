spring.application.name=ventas

server.port=

# Conexion a MySQL local (100% aislado en Docker local)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ventas_publicador}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Persistencia con JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Mostrar las consultas SQL en consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Conexion a RabbitMQ local en Docker
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:ventas_publicador}
spring.rabbitmq.password=${RABBITMQ_PASS:ventas123}
spring.rabbitmq.virtual-host=ventas
spring.rabbitmq.connection-timeout=5s

# Confirmaciones de publicacion
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Recursos creados en RabbitMQ
app.rabbitmq.exchange=ventas.exchange
app.rabbitmq.routing-key=ventas.creada
