spring.application.name=ventas-consumidor

server.port=${SERVER_PORT:8081}

# Base de datos local exclusiva del consumidor en Docker
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ventas_consumidor}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# RabbitMQ local en Docker
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:ventas_consumidor}
spring.rabbitmq.password=${RABBITMQ_PASS:ventas123}
spring.rabbitmq.virtual-host=ventas
spring.rabbitmq.connection-timeout=5s

# Configuracion de consumo (un mensaje a la vez)
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
spring.rabbitmq.listener.simple.prefetch=1

# Confirmar despues de procesar correctamente
spring.rabbitmq.listener.simple.acknowledge-mode=auto

# Reencolar ante errores de procesamiento recuperables
spring.rabbitmq.listener.simple.default-requeue-rejected=true

# Cola existente en RabbitMQ
app.rabbitmq.queue=ventas.queue
